<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Graph · Sunburst View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f14;
            --bg-secondary: #16161e;
            --bg-tertiary: #1e1e2a;
            --bg-hover: #262636;
            --border: #2a2a3a;
            --text-primary: #e2e2f0;
            --text-secondary: #9090a8;
            --text-muted: #5e5e76;
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --accent-glow: #7c3aed55;
            --emphasis: #f59e0b;
            --radius: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ---- Sidebar ---- */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 200;
        }

        #sidebar-header {
            padding: 20px 20px 12px;
            border-bottom: 1px solid var(--border);
        }

        #sidebar-header h1 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #sidebar-header h1::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 10px;
            margin-top: 16px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .ai-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            margin-bottom: 8px;
        }

        .ai-toggle input[type="checkbox"] {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .ai-toggle label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .field-groups-container {
            max-height: 30vh;
            overflow-y: auto;
            margin-top: 8px;
        }

        .field-groups-container::-webkit-scrollbar {
            width: 3px;
        }

        .field-groups-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .field-group {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
        }

        .field-group-concept {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--emphasis);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .field-group-field {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            padding: 1px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            color: white;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }

        #status-bar {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
            min-height: 1.2em;
        }

        #status-bar.loading {
            color: var(--emphasis);
        }

        .progress-steps {
            margin-top: 6px;
        }

        .progress-step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            color: var(--text-muted);
            padding: 2px 0;
        }

        .progress-step.active {
            color: var(--emphasis);
        }

        .progress-step.done {
            color: #22c55e;
        }

        .progress-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }

        .progress-step.active .progress-dot {
            background: var(--emphasis);
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
        }

        .progress-step.done .progress-dot {
            background: #22c55e;
        }

        /* ---- Sunburst ---- */
        #graph-container {
            position: fixed;
            top: 0;
            left: 300px;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sunburst-svg {
            cursor: pointer;
        }

        /* ---- Breadcrumb ---- */
        #breadcrumb {
            position: fixed;
            top: 16px;
            left: 320px;
            z-index: 100;
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }

        .crumb {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }

        .crumb:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .crumb.active {
            color: var(--accent-light);
            border-color: var(--accent);
        }

        .crumb-sep {
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        /* ---- Detail Panel ---- */
        #detail-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 55vw;
            \n max-width: 900px;
            height: 100vh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            z-index: 300;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        #detail-panel.open {
            transform: translateX(0);
        }

        #detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            min-height: 56px;
        }

        #detail-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        #detail-close {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all var(--transition);
            flex-shrink: 0;
            margin-left: 12px;
        }

        #detail-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        #detail-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        #detail-body::-webkit-scrollbar {
            width: 4px;
        }

        #detail-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .detail-field {
            display: flex;
            padding: 6px 0;
            border-bottom: 1px solid rgba(42, 42, 58, 0.5);
            font-size: 0.8rem;
        }

        .detail-field-key {
            color: var(--accent-light);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            min-width: 100px;
            flex-shrink: 0;
            padding-right: 12px;
        }

        .detail-field-value {
            color: var(--text-primary);
            word-break: break-word;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }

        .detail-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 500;
            margin-bottom: 8px;
            margin-right: 6px;
            background: rgba(245, 158, 11, 0.15);
            color: var(--emphasis);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .row-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            margin-bottom: 10px;
        }

        .row-card-header {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        #detail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 250;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #detail-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Tooltip */
        .sunburst-tooltip {
            position: fixed;
            z-index: 400;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: var(--text-primary);
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-width: 250px;
        }

        .sunburst-tooltip .tt-label {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .sunburst-tooltip .tt-count {
            color: var(--emphasis);
            font-size: 0.7rem;
        }

        /* ---- Data Table ---- */
        .table-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            max-height: calc(100vh - 160px);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .data-table th {
            background: var(--bg-primary);
            color: var(--accent-light);
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 2px solid var(--accent);
            white-space: nowrap;
        }

        .data-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .data-table tbody tr {
            cursor: pointer;
            transition: background var(--transition);
        }

        .data-table tbody tr:hover {
            background: var(--bg-hover);
        }

        .data-table tbody tr:nth-child(even) {
            background: rgba(30, 30, 42, 0.5);
        }

        .data-table tbody tr:nth-child(even):hover {
            background: var(--bg-hover);
        }

        .collection-tag {
            display: inline-block;
            background: rgba(124, 58, 237, 0.2);
            color: var(--accent-light);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 500;
            border: 1px solid rgba(124, 58, 237, 0.3);
        }

        .detail-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 12px;
        }

        .detail-back-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .detail-info-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .detail-stat {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.68rem;
            font-weight: 500;
        }

        .detail-stat.count {
            background: rgba(245, 158, 11, 0.15);
            color: var(--emphasis);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .detail-stat.equiv {
            background: rgba(6, 182, 212, 0.15);
            color: #22d3ee;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .detail-stat.collections {
            background: rgba(124, 58, 237, 0.15);
            color: var(--accent-light);
            border: 1px solid rgba(124, 58, 237, 0.3);
        }

        .kv-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        .kv-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.78rem;
            vertical-align: top;
        }

        .kv-table td:first-child {
            color: var(--accent-light);
            font-weight: 500;
            white-space: nowrap;
            width: 140px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.73rem;
        }

        .kv-table td:last-child {
            color: var(--text-primary);
            word-break: break-word;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.73rem;
        }

        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.85rem;
            gap: 10px;
        }

        .loading-spinner::before {
            content: '';
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Concept summary cards */
        .concept-field-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .concept-field-card:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .concept-field-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-primary);
        }

        .concept-field-count {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <h1>Sunburst Explorer</h1>
        </div>
        <div class="sidebar-content">
            <div class="section-title">AI Field Analysis</div>
            <div class="ai-toggle">
                <input type="checkbox" id="use-llm" checked>
                <label for="use-llm">Use AI to group related fields</label>
            </div>

            <div id="field-groups-section" style="display: none;">
                <div class="section-title" style="margin-top: 8px;">Detected Relationships</div>
                <div class="field-groups-container" id="field-groups-list"></div>
            </div>

            <div class="section-title">Navigation</div>
            <p style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.5;">
                <strong>Click</strong> a slice to zoom in.<br>
                <strong>Click center</strong> to zoom out.<br>
                <strong>Click leaf</strong> (value) to see details.
            </p>
        </div>
        <div id="sidebar-footer">
            <button class="btn btn-primary" id="generate-btn">Generate Sunburst</button>
            <div id="status-bar"></div>
        </div>
    </div>

    <div id="breadcrumb"></div>
    <div id="graph-container"></div>
    <div id="detail-overlay"></div>

    <div id="detail-panel">
        <div id="detail-header">
            <span id="detail-title">Node</span>
            <button id="detail-close">✕</button>
        </div>
        <div id="detail-body"></div>
    </div>

    <div class="sunburst-tooltip" id="tooltip" style="display: none;"></div>

    <script>
        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';
        let treeData = null;
        let lastFieldGroups = [];  // store for query endpoint
        let detailHistory = [];    // drill-down navigation stack

        // ---- Status ----
        const statusBar = document.getElementById('status-bar');
        function setStatus(msg, isLoading = false) {
            statusBar.textContent = msg;
            statusBar.className = isLoading ? 'loading' : '';
        }

        // ---- Color palette ----
        const conceptColors = [
            '#7c3aed', '#6d28d9', '#8b5cf6', '#a78bfa',
            '#f59e0b', '#d97706', '#fbbf24',
            '#06b6d4', '#0891b2', '#22d3ee',
            '#10b981', '#059669', '#34d399',
            '#ec4899', '#db2777', '#f472b6',
            '#ef4444', '#dc2626', '#f87171',
        ];

        function getColor(d) {
            if (d.depth === 0) return '#1e1e2a';  // center
            // Find the ancestor at depth 1 (concept level)
            let ancestor = d;
            while (ancestor.depth > 1) ancestor = ancestor.parent;
            const idx = ancestor.parent.children.indexOf(ancestor);
            const base = d3.color(conceptColors[idx % conceptColors.length]);

            if (d.depth === 1) return base.toString();
            if (d.depth === 2) return base.brighter(0.4).toString();
            // depth 3+ (values) — vary by position
            const childIdx = d.parent.children.indexOf(d);
            const total = d.parent.children.length;
            const t = total > 1 ? childIdx / (total - 1) : 0.5;
            return d3.interpolate(base.brighter(0.6), base.darker(0.3))(t);
        }

        // ---- Sunburst ----
        let svg, arc, root, currentFocus;
        const tooltip = document.getElementById('tooltip');

        function renderSunburst(data) {
            const container = document.getElementById('graph-container');
            container.innerHTML = '';

            const width = container.clientWidth;
            const height = container.clientHeight;
            const radius = Math.min(width, height) / 2 - 20;

            root = d3.hierarchy(data)
                .sum(d => d.value || 0)
                .sort((a, b) => b.value - a.value);

            d3.partition().size([2 * Math.PI, radius])(root);

            currentFocus = root;

            arc = d3.arc()
                .startAngle(d => d.x0)
                .endAngle(d => d.x1)
                .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
                .padRadius(radius / 2)
                .innerRadius(d => d.y0)
                .outerRadius(d => d.y1 - 1);

            svg = d3.select(container).append('svg')
                .attr('id', 'sunburst-svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${width / 2},${height / 2})`);

            const path = svg.selectAll('path')
                .data(root.descendants())
                .join('path')
                .attr('d', arc)
                .attr('fill', d => getColor(d))
                .attr('fill-opacity', d => d.depth === 0 ? 0.3 : arcVisible(d) ? 0.85 : 0)
                .attr('stroke', '#0f0f14')
                .attr('stroke-width', 0.5)
                .style('cursor', 'pointer')
                .on('click', (event, d) => clicked(d))
                .on('mouseover', (event, d) => showTooltip(event, d))
                .on('mousemove', (event) => moveTooltip(event))
                .on('mouseout', () => hideTooltip());

            // Labels
            const label = svg.selectAll('text')
                .data(root.descendants())
                .join('text')
                .attr('dy', '0.35em')
                .attr('fill', '#e2e2f0')
                .attr('fill-opacity', d => labelVisible(d) ? 1 : 0)
                .attr('font-size', d => d.depth <= 1 ? '11px' : '9px')
                .attr('font-weight', d => d.depth <= 1 ? '600' : '400')
                .attr('font-family', 'Inter, sans-serif')
                .attr('text-anchor', 'middle')
                .attr('pointer-events', 'none')
                .attr('transform', d => labelTransform(d))
                .text(d => {
                    const name = d.data.name || '';
                    const maxLen = d.depth <= 1 ? 18 : 14;
                    return name.length > maxLen ? name.slice(0, maxLen) + '…' : name;
                });

            // Center text
            svg.append('text')
                .attr('text-anchor', 'middle')
                .attr('dy', '-0.2em')
                .attr('fill', '#a78bfa')
                .attr('font-size', '14px')
                .attr('font-weight', '600')
                .attr('font-family', 'Inter, sans-serif')
                .attr('id', 'center-label')
                .text(data.name);

            svg.append('text')
                .attr('text-anchor', 'middle')
                .attr('dy', '1.2em')
                .attr('fill', '#5e5e76')
                .attr('font-size', '10px')
                .attr('font-family', 'Inter, sans-serif')
                .attr('id', 'center-sublabel')
                .text('click to explore');

            updateBreadcrumb(root);
        }

        function clicked(p) {
            if (p.depth > 0 && (!p.children || p.data.docs)) {
                // Leaf node (value) — query with field + value
                const fieldNode = p.parent;
                const field = fieldNode ? fieldNode.data.name : p.data.name;
                const value = p.data.full_value || p.data.name;
                fetchAndShowTable(field, value, `${field} = "${value}"`);
                return;
            }

            if (p.depth === 2 && p.children) {
                // Field node — query all docs with this field
                fetchAndShowTable(p.data.name, null, `All "${p.data.name}" records`);
                return;
            }

            if (p.depth === 1 && p.children) {
                // Concept node — show summary of fields under this concept
                showConceptSummary(p);
                return;
            }

            if (p === currentFocus) {
                // Clicking the focused node = go up
                p = p.parent || root;
            }

            currentFocus = p;

            root.each(d => {
                d.target = {
                    x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
                    x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
                    y0: Math.max(0, d.y0 - p.y0),
                    y1: Math.max(0, d.y1 - p.y0),
                };
            });

            const t = svg.transition().duration(650);

            svg.selectAll('path')
                .transition(t)
                .tween('data', d => {
                    const i = d3.interpolate({ x0: d.x0, x1: d.x1, y0: d.y0, y1: d.y1 }, d.target);
                    return t => { Object.assign(d, i(t)); };
                })
                .attrTween('d', d => () => arc(d))
                .attr('fill-opacity', d => {
                    if (d === currentFocus) return 0.3;
                    return arcVisible(d.target) ? 0.85 : 0;
                });

            svg.selectAll('text')
                .transition(t)
                .attr('fill-opacity', d => labelVisible(d.target) ? 1 : 0)
                .attrTween('transform', d => () => labelTransform(d));

            // Update center label
            d3.select('#center-label').text(p.data.name);
            d3.select('#center-sublabel').text(p.depth > 0 ? '← click center to go back' : 'click to explore');

            updateBreadcrumb(p);
        }

        function arcVisible(d) {
            return d.y1 > 0 && d.y0 < d.y1 && d.x1 > d.x0 + 0.001;
        }

        function labelVisible(d) {
            return d.y1 > 0 && d.y0 < d.y1 && (d.x1 - d.x0) > 0.03;
        }

        function labelTransform(d) {
            const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
            const y = (d.y0 + d.y1) / 2;
            return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
        }

        // ---- Breadcrumb ----
        function updateBreadcrumb(node) {
            const crumbBar = document.getElementById('breadcrumb');
            crumbBar.innerHTML = '';
            const ancestors = node.ancestors().reverse();
            ancestors.forEach((a, i) => {
                if (i > 0) {
                    const sep = document.createElement('span');
                    sep.className = 'crumb-sep';
                    sep.textContent = '›';
                    crumbBar.appendChild(sep);
                }
                const btn = document.createElement('span');
                btn.className = 'crumb' + (a === node ? ' active' : '');
                btn.textContent = a.data.name;
                btn.addEventListener('click', () => clicked(a));
                crumbBar.appendChild(btn);
            });
        }

        // ---- Tooltip ----
        function showTooltip(event, d) {
            if (d.depth === 0) return;
            let html = `<div class="tt-label">${d.data.name}</div>`;
            if (d.value) html += `<div class="tt-count">Frequency: ${d.value}</div>`;
            if (d.data.collections) html += `<div style="color: #9090a8; font-size: 0.68rem; margin-top: 2px;">Collections: ${d.data.collections.join(', ')}</div>`;
            if (d.children) html += `<div style="color: #5e5e76; font-size: 0.68rem;">${d.children.length} children</div>`;
            tooltip.innerHTML = html;
            tooltip.style.display = 'block';
            moveTooltip(event);
        }

        function moveTooltip(event) {
            tooltip.style.left = (event.clientX + 14) + 'px';
            tooltip.style.top = (event.clientY - 10) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        // ---- Detail Panel ----
        const detailPanel = document.getElementById('detail-panel');
        const detailOverlay = document.getElementById('detail-overlay');
        const detailTitle = document.getElementById('detail-title');
        const detailBody = document.getElementById('detail-body');

        document.getElementById('detail-close').addEventListener('click', closeDetailPanel);
        detailOverlay.addEventListener('click', closeDetailPanel);

        function closeDetailPanel() {
            detailPanel.classList.remove('open');
            detailOverlay.classList.remove('visible');
        }

        // ---- Concept Summary View ----
        function showConceptSummary(conceptNode) {
            detailHistory = [];
            detailTitle.textContent = conceptNode.data.name;
            detailBody.innerHTML = '';

            const info = document.createElement('div');
            info.className = 'detail-info-bar';
            info.innerHTML = `<span class="detail-stat count">${conceptNode.children.length} fields</span>`;
            detailBody.appendChild(info);

            conceptNode.children.forEach(fieldNode => {
                const card = document.createElement('div');
                card.className = 'concept-field-card';

                const valCount = fieldNode.children ? fieldNode.children.length : 0;
                const totalFreq = fieldNode.value || 0;

                card.innerHTML = `
                    <span class="concept-field-name">${fieldNode.data.name}</span>
                    <span class="concept-field-count">${valCount} values · ${totalFreq} total</span>
                `;

                card.addEventListener('click', () => {
                    fetchAndShowTable(fieldNode.data.name, null, `All "${fieldNode.data.name}" records`);
                });

                detailBody.appendChild(card);
            });

            detailPanel.classList.add('open');
            detailOverlay.classList.add('visible');
        }

        // ---- Fetch & Render Table ----
        async function fetchAndShowTable(field, value, title) {
            detailTitle.textContent = title || field;
            detailBody.innerHTML = '<div class="loading-spinner">Loading data…</div>';
            detailPanel.classList.add('open');
            detailOverlay.classList.add('visible');

            try {
                const res = await fetch(`${API_BASE}/api/query-field`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ db: 'test', field, value }),
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                detailBody.innerHTML = '';

                // Back button if we have history
                if (detailHistory.length > 0) {
                    const back = document.createElement('button');
                    back.className = 'detail-back-btn';
                    back.innerHTML = '← Back';
                    back.addEventListener('click', () => {
                        const prev = detailHistory.pop();
                        prev();
                    });
                    detailBody.appendChild(back);
                }

                // Info bar
                const infoBar = document.createElement('div');
                infoBar.className = 'detail-info-bar';
                infoBar.innerHTML = `<span class="detail-stat count">${data.total} record${data.total !== 1 ? 's' : ''}</span>`;

                if (data.equivalent_fields && data.equivalent_fields.length > 1) {
                    infoBar.innerHTML += `<span class="detail-stat equiv">Also matched: ${data.equivalent_fields.filter(f => f !== field).join(', ')}</span>`;
                }

                // Collect unique collections
                const collections = [...new Set(data.rows.map(r => r._collection).filter(Boolean))];
                if (collections.length > 1) {
                    infoBar.innerHTML += `<span class="detail-stat collections">Across ${collections.length} collections</span>`;
                }
                detailBody.appendChild(infoBar);

                if (data.rows.length === 0) {
                    detailBody.innerHTML += '<p style="color: var(--text-muted); font-size: 0.85rem; padding: 20px 0;">No matching records found.</p>';
                    return;
                }

                // Determine visible columns (skip _id, prioritize important ones)
                const columns = (data.columns || []).filter(c => c !== '_id');
                // Move _collection to front if it exists
                const colIdx = columns.indexOf('_collection');
                if (colIdx > 0) {
                    columns.splice(colIdx, 1);
                    columns.unshift('_collection');
                }

                // Build table
                const tableContainer = document.createElement('div');
                tableContainer.className = 'table-container';

                const table = document.createElement('table');
                table.className = 'data-table';

                // Header
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                columns.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = col === '_collection' ? 'Collection' : col;
                    th.title = col;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                // Body
                const tbody = document.createElement('tbody');
                data.rows.forEach(row => {
                    const tr = document.createElement('tr');
                    columns.forEach(col => {
                        const td = document.createElement('td');
                        const val = row[col] || '';
                        if (col === '_collection') {
                            td.innerHTML = `<span class="collection-tag">${val}</span>`;
                        } else {
                            td.textContent = val;
                            td.title = val;
                        }
                        tr.appendChild(td);
                    });

                    // Click row to drill down into full document detail
                    tr.addEventListener('click', () => {
                        // Push current view onto history
                        const currentField = field;
                        const currentValue = value;
                        const currentTitle = title;
                        detailHistory.push(() => fetchAndShowTable(currentField, currentValue, currentTitle));
                        showRowDetail(row, columns);
                    });

                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                tableContainer.appendChild(table);
                detailBody.appendChild(tableContainer);

            } catch (err) {
                detailBody.innerHTML = `<p style="color: #ef4444; padding: 20px;">Error: ${err.message}</p>`;
            }
        }

        // ---- Row Detail (drill-down key-value table) ----
        function showRowDetail(row, columns) {
            detailTitle.textContent = row['name'] || row['first_name'] || row['title'] || row['_collection'] || 'Document Detail';
            detailBody.innerHTML = '';

            // Back button
            const back = document.createElement('button');
            back.className = 'detail-back-btn';
            back.innerHTML = '← Back to table';
            back.addEventListener('click', () => {
                const prev = detailHistory.pop();
                if (prev) prev();
            });
            detailBody.appendChild(back);

            // Collection badge
            if (row._collection) {
                const info = document.createElement('div');
                info.className = 'detail-info-bar';
                info.innerHTML = `<span class="collection-tag">${row._collection}</span>`;
                if (row._id) {
                    info.innerHTML += `<span class="detail-stat count" style="margin-left: 4px;">ID: ${row._id}</span>`;
                }
                detailBody.appendChild(info);
            }

            // Key-value table
            const kvTable = document.createElement('table');
            kvTable.className = 'kv-table';

            // Show all fields from the row
            const allKeys = Object.keys(row).filter(k => !k.startsWith('_'));
            allKeys.forEach(key => {
                const tr = document.createElement('tr');
                const tdKey = document.createElement('td');
                tdKey.textContent = key;
                const tdVal = document.createElement('td');
                const val = row[key] || '';
                tdVal.textContent = val;

                // Make values clickable to query further
                if (val && val.length > 0 && val.length < 100) {
                    tdVal.style.cursor = 'pointer';
                    tdVal.style.textDecoration = 'underline dotted var(--text-muted)';
                    tdVal.title = `Click to find all records with ${key} = "${val}"`;
                    tdVal.addEventListener('click', (e) => {
                        e.stopPropagation();
                        detailHistory.push(() => showRowDetail(row, columns));
                        fetchAndShowTable(key, val, `${key} = "${val}"`);
                    });
                }

                tr.appendChild(tdKey);
                tr.appendChild(tdVal);
                kvTable.appendChild(tr);
            });

            detailBody.appendChild(kvTable);
        }

        // ---- Generate ----
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const useLLM = document.getElementById('use-llm').checked;

            const steps = [
                { id: 'step-schema', label: 'Scanning schema cache' },
                { id: 'step-llm', label: 'Analyzing fields with AI' },
                { id: 'step-graph', label: 'Building sunburst tree' },
            ];

            let progressHTML = '<div class="progress-steps">';
            steps.forEach(s => {
                progressHTML += `<div class="progress-step" id="${s.id}"><div class="progress-dot"></div>${s.label}</div>`;
            });
            progressHTML += '</div>';
            statusBar.innerHTML = progressHTML;
            statusBar.className = 'loading';

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.textContent = 'Generating…';

            try {
                document.getElementById('step-schema').classList.add('active');
                await new Promise(r => setTimeout(r, 50));

                if (useLLM) {
                    document.getElementById('step-schema').classList.remove('active');
                    document.getElementById('step-schema').classList.add('done');
                    document.getElementById('step-llm').classList.add('active');
                }

                const res = await fetch(`${API_BASE}/api/graph`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_db: 'test', use_llm: useLLM }),
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                steps.forEach(s => {
                    const el = document.getElementById(s.id);
                    el.classList.remove('active');
                    el.classList.add('done');
                });

                treeData = data.tree;
                renderSunburst(treeData);

                // Display field groups
                const fieldGroups = data.field_groups || [];
                const fgSection = document.getElementById('field-groups-section');
                const fgList = document.getElementById('field-groups-list');

                if (fieldGroups.length > 0) {
                    fgSection.style.display = 'block';
                    fgList.innerHTML = '';
                    fieldGroups.forEach(group => {
                        const div = document.createElement('div');
                        div.className = 'field-group';
                        let html = `<div class="field-group-concept">${group.concept.replace(/_/g, ' ')}</div>`;
                        group.fields.forEach(f => {
                            const short = f.split('.').filter(p => isNaN(p)).join('.');
                            html += `<div class="field-group-field" title="${f}">${short}</div>`;
                        });
                        div.innerHTML = html;
                        fgList.appendChild(div);
                    });
                } else {
                    fgSection.style.display = 'none';
                }

                // Count leaves
                const countLeaves = (node) => {
                    if (!node.children) return 1;
                    return node.children.reduce((sum, c) => sum + countLeaves(c), 0);
                };
                const leaves = countLeaves(treeData);
                const concepts = (treeData.children || []).length;

                setStatus(`${concepts} concepts · ${leaves} values` +
                    (fieldGroups.length > 0 ? ` · ${fieldGroups.length} AI groups` : ''));
            } catch (err) {
                setStatus(`Error: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate Sunburst';
            }
        });

        // ---- Handle Resize ----
        window.addEventListener('resize', () => {
            if (treeData) renderSunburst(treeData);
        });
    </script>
</body>
